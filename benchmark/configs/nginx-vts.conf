worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr",'
            '"http_user_agent":"$http_user_agent",'
            '"http_host":"$http_host",'
            '"server_protocol":"$server_protocol",'
            '"request_length":$request_length,'
            '"bytes_sent":$bytes_sent
        '}';

    access_log /var/log/nginx/access.log json_combined;

    vhost_traffic_status_zone;
    # filter_by_host on — VTS автоматически разлагает метрики по Host запроса.
    # k6 шлёт Host: nginx-vts.benchmark.local -> метрика nginx_server_requests{host="nginx-vts.benchmark.local"}.
    vhost_traffic_status_filter_by_host on;

    # Default server: скрейпы nginx-vts-exporter к /status, обращения к /stub_status.
    # server_name _ ловит все Host'ы, кроме явно заданного nginx-vts.benchmark.local (см. ниже).
    # Без location / — чтобы скрейпы с Host=IP не попадали в backend и не искажали метрики.
    server {
        listen 80 default_server;
        server_name _;

        location /status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format json;
        }

        location /stub_status {
            stub_status;
        }
    }

    # Benchmark server: трафик от k6 (Host: nginx-vts.benchmark.local).
    # VTS разлагает метрики по host-лейблу -> nginx_server_requests{host="nginx-vts.benchmark.local"}.
    server {
        listen 80;
        server_name nginx-vts.benchmark.local;

        location / {
            proxy_pass http://BACKEND_ADDR;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
