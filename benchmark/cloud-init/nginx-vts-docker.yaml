#cloud-config
package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq

write_files:
  - path: /opt/nginx-vts-docker/nginx.conf
    content: |
      load_module modules/ngx_http_vhost_traffic_status_module.so;

      worker_processes auto;
      worker_rlimit_nofile 65535;
      error_log /var/log/nginx/error.log warn;
      pid /var/run/nginx.pid;

      events {
          worker_connections 4096;
          multi_accept on;
      }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          log_format json_combined escape=json '{"ts":"$time_iso8601","remote_addr":"$remote_addr","request_method":"$request_method","request_uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","upstream_addr":"$upstream_addr","http_user_agent":"$http_user_agent","http_host":"$http_host","server_protocol":"$server_protocol","request_length":$request_length,"bytes_sent":$bytes_sent}';

          access_log /var/log/nginx/access.log json_combined;

          vhost_traffic_status_zone;
          # filter_by_host on — VTS автоматически разлагает метрики по Host запроса.
          # k6 шлёт Host: nginx-vts.benchmark.local -> метрика nginx_server_requests{host="nginx-vts.benchmark.local"}.
          vhost_traffic_status_filter_by_host on;

          upstream backend {
              server ${backend_addr};
              keepalive 64;
          }

          # Default server: скрейпы nginx-vts-exporter к /status, обращения к /stub_status.
          # server_name _ ловит все Host'ы, кроме явно заданного nginx-vts.benchmark.local (см. ниже).
          # Без location / — чтобы скрейпы с Host=IP не попадали в backend и не искажали метрики.
          server {
              listen 80 default_server;
              server_name _;

              location /status {
                  vhost_traffic_status_display;
                  vhost_traffic_status_display_format json;
              }

              location /stub_status {
                  stub_status;
              }
          }

          # Benchmark server: трафик от k6 (Host: nginx-vts.benchmark.local).
          # VTS разлагает метрики по host-лейблу -> nginx_server_requests{host="nginx-vts.benchmark.local"}.
          server {
              listen 80;
              server_name nginx-vts.benchmark.local;

              location / {
                  proxy_pass http://backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Request-ID $request_id;
              }
          }
      }
    permissions: "0644"

  - path: /opt/nginx-vts-docker/vector.toml
    content: |
      data_dir = "/var/lib/vector"

      [sources.nginx_access]
      type = "file"
      include = ["/var/log/nginx/access.log"]
      read_from = "end"

      [sources.nginx_error]
      type = "file"
      include = ["/var/log/nginx/error.log"]
      read_from = "end"

      [transforms.parse_access]
      type = "remap"
      inputs = ["nginx_access"]
      source = '''
      . = parse_json!(.message)
      .instance = "nginx-vts-docker"
      .msg = join!([string(.request_method) ?? "-", string(.request_uri) ?? "-", string(.status) ?? "-"], " ")
      '''

      [transforms.parse_error]
      type = "remap"
      inputs = ["nginx_error"]
      source = '''
      .instance = "nginx-vts-docker"
      if is_json(string!(.message)) {
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) { . = merge!(., parsed) }
      }
      .msg = .message
      '''

      [sinks.victorialogs_access]
      type = "http"
      inputs = ["parse_access"]
      uri = "http://${vlinsert_addr}/insert/jsonline?_stream_fields=instance&_msg_field=msg&_time_field=ts"
      method = "post"
      encoding.codec = "json"
      framing.method = "newline_delimited"
      batch.max_bytes = 900000
      batch.timeout_secs = 2
      healthcheck.enabled = false

      [sinks.victorialogs_error]
      type = "http"
      inputs = ["parse_error"]
      uri = "http://${vlinsert_addr}/insert/jsonline?_stream_fields=instance&_msg_field=msg&_time_field=ts"
      method = "post"
      encoding.codec = "json"
      framing.method = "newline_delimited"
      batch.max_bytes = 900000
      batch.timeout_secs = 2
      healthcheck.enabled = false

      [sources.vector_metrics]
      type = "internal_metrics"

      [sinks.vector_metrics_export]
      type = "prometheus_exporter"
      inputs = ["vector_metrics"]
      address = "0.0.0.0:9598"
    permissions: "0644"

  - path: /opt/nginx-vts-docker/docker-compose.yml
    content: |
      services:
        nginx-vts:
          build:
            context: .
            dockerfile: Dockerfile
          container_name: nginx-vts
          ports:
            - "80:80"
            - "9913:9913"
          volumes:
            - /var/log/nginx:/var/log/nginx
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
          restart: unless-stopped

        vector:
          image: timberio/vector:0.57.0-debian
          container_name: vector
          command: ["--config", "/etc/vector/vector.toml"]
          volumes:
            - ./vector.toml:/etc/vector/vector.toml:ro
            - /var/log/nginx:/var/log/nginx:ro
            - vector-data:/var/lib/vector
          ports:
            - "9598:9598"
          depends_on:
            - nginx-vts
          restart: unless-stopped

      volumes:
        vector-data:
    permissions: "0644"

  - path: /opt/nginx-vts-docker/Dockerfile
    content: |
      FROM nginx:1.31.3-trixie

      RUN apt-get update && apt-get install -y git build-essential libpcre2-dev zlib1g-dev libssl-dev wget && \
          cd /tmp && \
          wget https://github.com/vozlt/nginx-module-vts/archive/refs/tags/v0.2.6.tar.gz && \
          tar xzf v0.2.6.tar.gz && \
          wget https://nginx.org/download/nginx-1.31.3.tar.gz && \
          tar xzf nginx-1.31.3.tar.gz && \
          cd nginx-1.31.3 && \
          ./configure --prefix=/etc/nginx --sbin-path=/usr/sbin/nginx --modules-path=/usr/lib/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log --pid-path=/var/run/nginx.pid \
            --with-compat --add-dynamic-module=/tmp/nginx-module-vts-0.2.6 && \
          make modules && \
          mkdir -p /etc/nginx/modules && \
          cp objs/ngx_http_vhost_traffic_status_module.so /etc/nginx/modules/ && \
          cd /tmp && \
          wget https://github.com/sysulq/nginx-vts-exporter/releases/download/v0.10.8/nginx-vtx-exporter_0.10.8_linux_amd64.tar.gz && \
          tar xzf nginx-vtx-exporter_0.10.8_linux_amd64.tar.gz && \
          cp nginx-vtx-exporter /usr/local/bin/nginx-vts-exporter && \
          apt-get purge -y git build-essential wget && apt-get autoremove -y && \
          rm -rf /tmp/nginx-* /tmp/nginx-module-vts-* /var/lib/apt/lists/*

      RUN mkdir -p /etc/nginx/modules-enabled && echo "load_module modules/ngx_http_vhost_traffic_status_module.so;" > /etc/nginx/modules-enabled/99-vts.conf

      EXPOSE 80 9913

      CMD ["sh", "-c", "nginx-vts-exporter -nginx.scrape_uri=http://127.0.0.1:80/status/format/json -telemetry.address=:9913 & nginx -g 'daemon off;'"]
    permissions: "0644"

  - path: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": ["https://mirror.gcr.io"]
      }
    permissions: "0644"

runcmd:
  - mkdir -p /var/lib/vector /var/log/nginx
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://mirror.yandex.ru/mirrors/download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://mirror.yandex.ru/mirrors/download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - docker compose -f /opt/nginx-vts-docker/docker-compose.yml up -d --build
  - |
    if ! docker ps --format '{{.Names}}' | grep -q '^nginx-vts$'; then
      echo "Initial compose up failed; retrying with explicit pulls via mirror.gcr.io"
      for img in timberio/vector:0.57.0-debian nginx:1.31.3-trixie; do
        for i in 1 2 3 4 5; do
          docker pull "$img" && break || { echo "pull $img attempt $i failed"; sleep 10; }
        done
      done
      docker compose -f /opt/nginx-vts-docker/docker-compose.yml up -d --build
    fi
