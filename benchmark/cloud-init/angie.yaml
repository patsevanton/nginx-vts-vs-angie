#cloud-config
package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq

write_files:
  - path: /etc/angie/angie.conf
    content: |
      worker_processes auto;
      worker_rlimit_nofile 65535;
      error_log /var/log/angie/error.log warn;
      pid /var/run/angie.pid;

      events {
          worker_connections 4096;
          multi_accept on;
      }

      http {
          include       /etc/angie/mime.types;
          include       /etc/angie/prometheus_all.conf;
          default_type  application/octet-stream;
          # mime.types устанавливается пакетом angie; если отсутствует, будет создан в runcmd

          log_format json_combined escape=json
              '{'
                  '"ts":"$time_iso8601",'
                  '"remote_addr":"$remote_addr",'
                  '"request_method":"$request_method",'
                  '"request_uri":"$request_uri",'
                  '"status":$status,'
                  '"body_bytes_sent":$body_bytes_sent,'
                  '"request_time":$request_time,'
                  '"upstream_response_time":"$upstream_response_time",'
                  '"upstream_addr":"$upstream_addr",'
                  '"http_user_agent":"$http_user_agent",'
                  '"http_host":"$http_host",'
                  '"server_protocol":"$server_protocol",'
                  '"request_length":$request_length,'
                  '"bytes_sent":$bytes_sent'
              '}';

          access_log /var/log/angie/access.log json_combined;

          upstream backend {
              zone upstream_backend 64k;
              server ${backend_addr_1};
              server ${backend_addr_2};
              keepalive 64;
          }

          # Default server: скрейпы vmagent к /metrics, обращения к /api/, /console/, /status.html.
          # Без status_zone — не искажает метрики зоны бенчмарка.
          server {
              listen 80 default_server;
              server_name _;

              location / {
                  return 404;
              }

              location /api/ {
                  api /status/;
              }

              location = /metrics {
                  prometheus all;
              }

              location /status.html {
                  stub_status;
              }

              location /console/ {
                  auto_redirect on;
                  alias /usr/share/angie-console-light/html/;
                  index index.html;

                  location /console/api/ {
                      api /status/;
                  }
              }
          }

          # Benchmark server: трафик от k6 (Host: angie.benchmark.local).
          # status_zone -> метрика angie_http_server_zones_*{zone="angie.benchmark.local"}.
          server {
              listen 80;
              server_name angie.benchmark.local;

              status_zone angie.benchmark.local;

              location / {
                  proxy_pass http://backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Request-ID $request_id;
              }
          }
      }
    permissions: "0644"

  - path: /etc/apt/preferences.d/angie
    content: |
      Package: *
      Pin: origin download.angie.software
      Pin-Priority: 900
    permissions: "0644"

  - path: /etc/vector/vector.toml
    content: |
      data_dir = "/var/lib/vector"

      [sources.angie_access]
      type = "file"
      include = ["/var/log/angie/access.log"]
      read_from = "end"

      [sources.angie_error]
      type = "file"
      include = ["/var/log/angie/error.log"]
      read_from = "end"

      [transforms.parse_access]
      type = "remap"
      inputs = ["angie_access"]
      source = '''
      . = parse_json!(.message)
      .instance = "angie"
      .msg = join!([string(.request_method) ?? "-", string(.request_uri) ?? "-", string(.status) ?? "-"], " ")
      '''

      [transforms.parse_error]
      type = "remap"
      inputs = ["angie_error"]
      source = '''
      .instance = "angie"
      if is_json(string!(.message)) {
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) { . = merge!(., parsed) }
      }
      .msg = .message
      '''

      [sinks.victorialogs_access]
      type = "http"
      inputs = ["parse_access"]
      uri = "http://${vlinsert_addr}/insert/jsonline?_stream_fields=instance&_msg_field=msg&_time_field=ts"
      method = "post"
      encoding.codec = "json"
      framing.method = "newline_delimited"
      batch.max_bytes = 900000
      batch.timeout_secs = 2
      healthcheck.enabled = false

      [sinks.victorialogs_error]
      type = "http"
      inputs = ["parse_error"]
      uri = "http://${vlinsert_addr}/insert/jsonline?_stream_fields=instance&_msg_field=msg&_time_field=ts"
      method = "post"
      encoding.codec = "json"
      framing.method = "newline_delimited"
      batch.max_bytes = 900000
      batch.timeout_secs = 2
      healthcheck.enabled = false

      [sources.vector_metrics]
      type = "internal_metrics"

      [sinks.vector_metrics_export]
      type = "prometheus_exporter"
      inputs = ["vector_metrics"]
      address = "0.0.0.0:9598"
    permissions: "0644"

  - path: /etc/systemd/system/vector.service
    content: |
      [Unit]
      Description=Vector
      Documentation=https://vector.dev
      After=network-online.target
      Requires=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/vector --config /etc/vector/vector.toml
      Restart=always

      [Install]
      WantedBy=multi-user.target
    permissions: "0644"

runcmd:
  - mkdir -p /var/lib/vector
  - curl -fsSL https://angie.software/keys/angie-signing.gpg -o /etc/apt/trusted.gpg.d/angie-signing.gpg
  - echo "deb https://download.angie.software/angie/ubuntu/22.04 jammy main" > /etc/apt/sources.list.d/angie.list
  - apt-get update
  # Сохраняем наш /etc/angie/angie.conf при установке пакета (избегаем интерактивного conffile prompt)
  - apt-get install -y -o Dpkg::Options::="--force-confold" angie angie-console-light
  - mkdir -p /var/log/angie
  # mime.types может отсутствовать, если dpkg не завершил конфигурацию — завершаем вручную
  - test -f /etc/angie/mime.types || cp /etc/angie/mime.types.dpkg-new /etc/angie/mime.types
  - dpkg --configure -a
  - systemctl enable angie
  - systemctl start angie
  - wget -q https://packages.timber.io/vector/0.57.0/vector-0.57.0-x86_64-unknown-linux-gnu.tar.gz -O /tmp/vector.tar.gz
  - tar xzf /tmp/vector.tar.gz -C /tmp
  - cp /tmp/vector-x86_64-unknown-linux-gnu/bin/vector /usr/local/bin/
  - chmod +x /usr/local/bin/vector
  - rm -rf /tmp/vector*
  - systemctl daemon-reload
  - systemctl enable vector
  - systemctl start vector
